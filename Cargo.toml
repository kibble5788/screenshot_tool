[package]
name = "screenshot_tool"
version = "2.0.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
arboard = "3.3"
rfd = "0.14"
chrono = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
xcap = "0.8"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
